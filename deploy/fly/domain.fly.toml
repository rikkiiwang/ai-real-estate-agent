# Domain — Rails consumer marketplace + broker dashboard (web). Uses the
# Rails-generated production Dockerfile (RAILS_ENV=production, Thruster). Build
# context is services/domain. PUBLIC: its root `/` is the consumer listing site
# (browse/buy/sell + agent sidebar); the broker dashboard is at `/broker` behind
# HTTP basic auth. deploy.sh allocates public IPs. The web process calls the
# brain over flycast (BRAIN_ADDR) for the agent sidebar, valuation, and the
# Closer contract draft. Migrations run once per deploy via release_command, so
# the web/grpc machines never race on schema setup.
app = "are-domain"
primary_region = "dfw"

[build]
  dockerfile = "../../services/domain/Dockerfile"   # services/domain/Dockerfile (context = services/domain)

[deploy]
  release_command = "bin/rails db:prepare"

[env]
  RAILS_ENV = "production"
  HTTP_PORT = "8080"            # Thruster listens here; uid 1000 cannot bind :80
  BRAIN_ADDR = "are-brain.flycast:50051"  # agent sidebar, valuation, Closer over the private mesh
  # RAILS_MASTER_KEY and DATABASE_URL (domain_production) set via `fly secrets set`.

[http_service]
  internal_port = 8080          # matches Thruster's HTTP_PORT (non-privileged)
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/up"              # Rails default health endpoint
    interval = "15s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
