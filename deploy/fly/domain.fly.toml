# Domain — Rails broker dashboard (web). Uses the Rails-generated production
# Dockerfile (RAILS_ENV=production, Thruster). Build context is services/domain.
# Internal by default (are-domain.flycast); allocate IPs to expose the dashboard
# publicly (see DEPLOY.md). Migrations run once per deploy via release_command,
# so the web/grpc machines never race on schema setup.
app = "are-domain"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"   # services/domain/Dockerfile (context = services/domain)

[deploy]
  release_command = "bin/rails db:prepare"

[env]
  RAILS_ENV = "production"
  # RAILS_MASTER_KEY and DATABASE_URL (domain_production) set via `fly secrets set`.

[http_service]
  internal_port = 80          # Thruster listens on 80 in the prod image
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/up"              # Rails default health endpoint
    interval = "15s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
