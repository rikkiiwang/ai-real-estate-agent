# Brain — Python gRPC (valuation, verification, lawyer, RAG, orchestrator).
# Internal-only: reachable at are-brain.flycast:50051. Build context is the repo
# root (the Dockerfile copies services/brain).
app = "are-brain"
primary_region = "dfw"

[build]
  dockerfile = "deploy/Dockerfile.brain"

[env]
  BRAIN_BIND = "[::]:50051"
  DOMAIN_GRPC_ADDR = "are-domain-grpc.flycast:50052"
  # DATABASE_URL (RAG store) and GEMINI_API_KEY are set via `fly secrets set`.

[[services]]
  internal_port = 50051
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 50051

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # scikit-learn + langgraph; AVM trains at startup
