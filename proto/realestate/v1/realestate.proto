syntax = "proto3";

package realestate.v1;

option go_package = "github.com/airealestate/realestate/proto/gen/go/realestate/v1;realestatev1";

// ── Valuation (the "Brain") ──────────────────────────────────────────────────

// Valuation produces a real-time, source-cited home valuation.
service Valuation {
  rpc GetValuation(GetValuationRequest) returns (GetValuationResponse);
}

message GetValuationRequest {
  string address = 1;
}

// A single fact backing a valuation, carrying provenance for citation by the
// Critic/Lawyer layer. `source_id` references a row in the RAG source store.
message SourceFact {
  string source_id = 1;   // stable provenance id
  string kind = 2;        // e.g. "tcad_appraisal", "gis_attribute", "comp_sale"
  string description = 3; // human-readable fact
  double contribution = 4; // feature contribution to the valuation, if any
}

message GetValuationResponse {
  bool sufficient_data = 1;       // false => insufficient coverage for this address
  double estimate = 2;            // point estimate (USD); 0 when sufficient_data == false
  double low = 3;                 // uncertainty band low
  double high = 4;                // uncertainty band high
  repeated SourceFact facts = 5;  // source-backed features for citation
}

// ── Verification (the "Lawyer") ──────────────────────────────────────────────

// Verification checks customer-facing claims against source data before send.
service Verification {
  rpc VerifyMessage(VerifyMessageRequest) returns (VerifyMessageResponse);
}

message VerifyMessageRequest {
  string draft = 1;               // candidate customer-facing message
  string context_address = 2;     // address scope for retrieval, optional
}

enum ClaimVerdict {
  CLAIM_VERDICT_UNSPECIFIED = 0;
  CLAIM_VERDICT_ENTAILED = 1;
  CLAIM_VERDICT_CONTRADICTED = 2;
  CLAIM_VERDICT_BASELESS = 3;
}

message VerifiedClaim {
  string claim = 1;
  ClaimVerdict verdict = 2;
  string citation_source_id = 3;  // set when ENTAILED
}

message VerifyMessageResponse {
  bool approved = 1;              // false => blocked / escalate
  bool escalate = 2;             // true => route to human handoff
  double confidence = 3;         // composite 0..1
  string reason = 4;             // why blocked/escalated, if applicable
  repeated VerifiedClaim claims = 5;
}

// ── Conversation (the agent loop: generate→critique→fair-housing→decide) ─────

// Conversation runs one turn of the LangGraph orchestrator end to end and
// returns the full reasoning trace (draft, per-claim verdicts, citations,
// confidence sub-signals, Fair Housing decision, handoff trigger) so a UI can
// SHOW the agent reasoning over live data, not just the final answer.
service Conversation {
  rpc Orchestrate(OrchestrateRequest) returns (OrchestrateResponse);
}

message OrchestrateRequest {
  string address = 1;    // property the turn is about (scopes RAG retrieval)
  string query = 2;      // the customer-facing question
  string thread_id = 3;  // resumable run key (optional)
}

// One atomic claim the Critic verified, with its bound citation.
message ReasoningClaim {
  string claim = 1;
  string label = 2;               // "entailed" | "contradicted" | "baseless"
  double score = 3;               // entailment confidence 0..1
  string citation_source_id = 4;  // set when entailed
  string source_kind = 5;         // provenance kind of the cited source
  bool supported = 6;             // entailed AND cited (sendable)
  string reason = 7;
}

// One node in the agent loop — the UI renders these as a reasoning timeline.
message ReasoningStep {
  string node = 1;    // "generate" | "critique" | "fair_housing" | "decide"
  string title = 2;   // short label
  string detail = 3;  // human-readable summary of what happened
  string status = 4;  // "ok" | "warn" | "block"
}

message OrchestrateResponse {
  string outcome = 1;        // "send" | "handoff"
  bool escalated = 2;
  string final_message = 3;  // grounded, cited reply (empty on handoff)
  string draft = 4;          // raw generated draft (pre-verification)
  bool sufficient_data = 5;
  int32 attempts = 6;
  double confidence = 7;     // composite 0..1

  // Critic (U6)
  string verification_reason = 8;
  repeated ReasoningClaim claims = 9;
  repeated string citations = 10;

  // Composite-confidence sub-signals (U8)
  double coverage = 11;
  double agreement = 12;
  double self_consistency = 13;

  // Fair Housing wording rail (U7)
  bool fair_housing_allowed = 14;
  string fair_housing_reason = 15;

  // Handoff (U8) — populated when escalated
  string handoff_trigger = 16;
  string handoff_reason = 17;
  string handoff_recommended_action = 18;
  bool hard_trigger = 19;

  // Pre-built reasoning timeline for the UI.
  repeated ReasoningStep steps = 20;
}

// ── Domain (the transaction/CRM core, served by Rails) ───────────────────────

service Domain {
  rpc CreateLead(CreateLeadRequest) returns (Lead);
  rpc EnqueueHandoff(HandoffPacket) returns (EnqueueHandoffResponse);
  // CreateOffer lands a drafted cash/purchase offer in the broker-sign queue
  // (status awaiting_broker). A licensed human broker reviews and signs; the
  // agent never signs.
  rpc CreateOffer(CreateOfferRequest) returns (Offer);
}

message CreateLeadRequest {
  string side = 1;   // "seller" | "buyer"
  string address = 2;
  string contact = 3;
}

message Lead {
  string id = 1;
  string side = 2;
  string address = 3;
  string intent = 4; // "high" | "low" | "unknown"
}

message HandoffPacket {
  string lead_id = 1;
  string trigger = 2;     // e.g. "low_confidence", "legal_complexity", "hostile"
  double confidence = 3;
  string reason = 4;
  string transcript = 5;
  string recommended_action = 6;
}

message EnqueueHandoffResponse {
  string handoff_id = 1;
}

message CreateOfferRequest {
  string lead_id = 1;
  string side = 2;            // "seller" | "buyer"
  double amount = 3;          // offered cash/purchase price (in-band by construction)
  string property_address = 4;
  // Filled promulgated-TREC-form blanks (factual only) + selected contingencies,
  // serialized as JSON. The agent fills blanks/selects enumerated options only;
  // no clause language is authored (UPL boundary upstream).
  string form_json = 5;
}

message Offer {
  string id = 1;
  string lead_id = 2;
  string side = 3;
  double amount = 4;
  string status = 5;          // always "awaiting_broker" on create (never signed)
}

// ── Closer (TREC paperwork, blanks-only — served by the brain) ───────────────
//
// Makes the previously-unreachable Closer reachable: fills a PROMULGATED TREC
// form (factual blanks only) via brain.lawyer.trec_form.fill_trec_form. A
// request for a custom clause / non-standard term is REFUSED (UplViolation) and
// surfaced as a handoff — the agent never authors clause language (UPL line).
service Closer {
  rpc GenerateContract(GenerateContractRequest) returns (GenerateContractResponse);
}

message GenerateContractRequest {
  string property_address = 1;
  string buyer_name = 2;
  string seller_name = 3;
  double sales_price = 4;
  double earnest_money = 5;        // optional; 0 -> default fraction applied
  string effective_date = 6;
  string closing_date = 7;
  // Pass-through for a consumer's non-standard ask. If set, the fill REFUSES
  // (UPL) and the response escalates rather than authoring the clause.
  string custom_clause_request = 8;
}

message GenerateContractResponse {
  bool drafted = 1;
  string form_id = 2;
  string title = 3;
  string form_json = 4;            // filled factual blanks, serialized JSON
  string status = 5;               // "awaiting_broker" when drafted
  bool upl_blocked = 6;            // true when a custom clause was requested
  string handoff_reason = 7;       // why it escalated (UPL or invalid facts)
}
